services:
  mysql:
    image: mysql:8.0
    container_name: projeto-naturassp-mysql
    restart: always
    ports:
      - "3308:3307"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bd_naturassp
      MYSQL_USER: naturassp
      MYSQL_PASSWORD: q1w2e3r4
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - projeto-naturassp-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: projeto-naturassp-phpmyadmin
    restart: always
    depends_on:
      - mysql
    ports:
      - "5051:80"
    environment:
      PMA_USER: naturassp
      PMA_PASSWORD: q1w2e3r4
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    networks:
      - projeto-naturassp-network

volumes:
  mysql_data:

networks:
  projeto-naturassp-network:
    driver: bridge